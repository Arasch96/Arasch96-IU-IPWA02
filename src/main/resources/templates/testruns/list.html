<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Testläufe - Require4Testing</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container">

    <h1>Testläufe</h1>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Datum</th>
            <th>Status</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="run : ${testRuns}">
            <td th:text="${run.id}"></td>
            <td th:text="${run.name}"></td>
            <td th:text="${run.runDate}"></td>
            <td th:text="${run.status}"></td>
            <td><a th:href="@{/testruns/{id}(id=${run.id})}" class="btn btn-sm btn-outline-primary">Details</a></td>
        </tr>
        </tbody>
    </table>

    <h2>Neuen Testlauf anlegen</h2>

    <form th:action="@{/testruns}" method="post" class="mb-5">
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" name="name" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Datum</label>
            <input type="date" class="form-control" name="runDate" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Status</label>
            <select class="form-select" name="status">
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Speichern</button>
    </form>

</div>

</body>
</html>
