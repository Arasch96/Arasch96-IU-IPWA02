<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Testlauf Details - Require4Testing</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container">

    <p><a th:href="@{/testruns}">&laquo; zurück zur Übersicht</a></p>

    <h1 th:text="${testRun.name}"></h1>
    <p>
        Datum: <span th:text="${testRun.runDate}"></span> &middot;
        Status: <span th:text="${testRun.status}"></span>
    </p>

    <h2>Zugeordnete Testfälle</h2>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>Testfall</th>
            <th>Tester:in</th>
            <th>Ergebnis</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="exec : ${executions}">
            <td th:text="${exec.testCase.title}"></td>
            <td th:text="${exec.tester != null} ? ${exec.tester.name} : '-'"></td>
            <td>
                <form th:action="@{/testruns/executions/{id}/result(id=${exec.id})}" method="post" class="d-flex gap-2">
                    <select class="form-select form-select-sm" name="result" style="width: auto;">
                        <option th:each="r : ${results}" th:value="${r}" th:text="${r}"
                                th:selected="${r == exec.result}"></option>
                    </select>
                    <button type="submit" class="btn btn-sm btn-outline-primary">Ergebnis speichern</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(executions)}">
            <td colspan="3">Diesem Testlauf sind noch keine Testfälle zugeordnet.</td>
        </tr>
        </tbody>
    </table>

    <h2>Testfall zuordnen</h2>

    <form th:action="@{/testruns/{id}/assign(id=${testRun.id})}" method="post" class="mb-5 row g-2 align-items-end">
        <div class="col-auto">
            <label class="form-label">Testfall</label>
            <select class="form-select" name="testCaseId" required>
                <option th:each="tc : ${availableTestCases}" th:value="${tc.id}" th:text="${tc.title}"></option>
            </select>
        </div>
        <div class="col-auto">
            <label class="form-label">Tester:in</label>
            <select class="form-select" name="testerId">
                <option value="">- keine/r -</option>
                <option th:each="t : ${testers}" th:value="${t.id}" th:text="${t.name}"></option>
            </select>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Zuordnen</button>
        </div>
    </form>

</div>

</body>
</html>
