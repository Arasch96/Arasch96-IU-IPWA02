<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Testfälle - Require4Testing</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container">

    <h1>Testfälle</h1>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Titel</th>
            <th>Beschreibung</th>
            <th>Anforderung</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="tc : ${testCases}">
            <td th:text="${tc.id}"></td>
            <td th:text="${tc.title}"></td>
            <td th:text="${tc.description}"></td>
            <td th:text="${tc.requirement.title}"></td>
        </tr>
        </tbody>
    </table>

    <h2>Neuen Testfall anlegen</h2>

    <form th:action="@{/testcases}" method="post" class="mb-5">
        <div class="mb-3">
            <label class="form-label">Titel</label>
            <input type="text" class="form-control" name="title" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Beschreibung</label>
            <textarea class="form-control" name="description" rows="3"></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Zugehörige Anforderung</label>
            <select class="form-select" name="requirementId" required>
                <option th:each="req : ${requirements}" th:value="${req.id}" th:text="${req.title}"></option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Speichern</button>
    </form>

</div>

</body>
</html>
