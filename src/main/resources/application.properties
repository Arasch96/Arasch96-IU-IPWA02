spring.application.name=require4testing

# H2 im Dateimodus, damit die Daten den Neustart der Anwendung ueberleben
spring.datasource.url=jdbc:h2:file:./data/require4testing;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Schema wird von Hibernate aus den Entities erzeugt/aktualisiert
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# data.sql erst ausfuehren, nachdem Hibernate die Tabellen angelegt hat
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# H2-Konsole zum Reinschauen in die Datenbank, erreichbar unter /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080
